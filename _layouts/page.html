---
layout: default
---

<article class="page">
  <div class="container {% if page.wide %}container--wide{% else %}container--text{% endif %}">
    {% unless page.hide_title %}
      {% if page.title and page.title != "" %}
        <header class="page__header">
          {% if page.kicker %}
            <p class="kicker kicker--ember">{{ page.kicker }}</p>
          {% endif %}

          <h1 class="page__title">{{ page.title }}</h1>

          {% if page.description and page.description != "" %}
            <p class="page__deck">{{ page.description }}</p>
          {% endif %}
        </header>
      {% endif %}
    {% endunless %}

    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
